<svg viewBox="-12 -12 784 244" width="784" height="244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La boucle agentique : rassembler le contexte en lisant et en cherchant, agir en éditant et en créant, vérifier en lançant les tests et en lisant la sortie, puis recommencer un tour. La boucle s'arrête quand l'agent estime avoir fini ou quand vous l'arrêtez."><style>svg{--ink:#172033;--muted:#5a6579;--line:#dce2eb;--surface:#ffffff;--code-bg:#eef2f7;--accent:#2752c4;--accent-soft:#e7edfb;--mark:#a4520a;--font-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;--font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){svg{--ink:#e3e8f1;--muted:#98a3b7;--line:#263043;--surface:#151c28;--code-bg:#111925;--accent:#86a6ff;--accent-soft:#1b2640;--mark:#f0a35c;}}
.sch-bg{fill:var(--code-bg);}
.sch-wrap { overflow-x: auto; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
.sch-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.sch-hi { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.sch-zone { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 5; }
.sch-zlabel { fill: var(--muted); font: 500 11px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; }
.sch-name { fill: var(--ink); font: 700 19px var(--font-display); }
.sch-actor { fill: var(--ink); font: 600 14px var(--font-display); }
.sch-sub { fill: var(--muted); font: 400 12px var(--font-mono); }
.sch-k { fill: var(--muted); font: 500 10.5px var(--font-body); letter-spacing: 0.08em; }
.sch-v { fill: var(--ink); font: 400 12.5px var(--font-body); }
.sch-lbl { fill: var(--ink); font: 400 12px var(--font-body); }
.sch-phase { fill: var(--muted); font: 600 10.5px var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; }
.sch-life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.sch-tick { stroke: var(--muted); stroke-width: 1; }
.sch-flow { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.sch-flow.sch-tok { stroke: var(--accent); stroke-width: 2; }
.sch-flow.sch-ret { stroke-dasharray: 6 4; }
.sch-ah { fill: var(--ink); }
.sch-ah-tok { fill: var(--accent); }
text.sch-m, tspan.sch-m { font-family: var(--font-mono); font-size: 12px; }
text.sch-m { fill: var(--ink); }
text.sch-big { font-size: 14px; }
text.sch-dot { font-size: 22px; font-weight: 700; }
.sch-faint, text.sch-faint { fill: var(--muted); }
.sch-note { font-style: italic; }
.sch-secret, tspan.sch-secret, text.sch-secret { fill: var(--mark); font-weight: 600; }</style><rect class="sch-bg" x="-12" y="-12" width="784" height="244" rx="10"/><defs><marker id="ba-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sch-ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ba-tok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sch-ah-tok" d="M0,0 L10,5 L0,10 z"/></marker></defs><path class="sch-flow sch-tok" d="M635,78 L635,46 L125,46 L125,75" marker-end="url(#ba-tok)"/><text class="sch-lbl" x="380" y="36" text-anchor="middle">tour suivant : le modèle lit le résultat et choisit l'outil à appeler</text><rect class="sch-box" x="30" y="80" width="190" height="76" rx="10"/><text class="sch-actor" x="125" y="108" text-anchor="middle">Rassembler le contexte</text><text class="sch-lbl sch-faint" x="125" y="132" text-anchor="middle">lire, chercher</text><line class="sch-flow" x1="222" y1="118" x2="281" y2="118" marker-end="url(#ba-ink)"/><rect class="sch-box" x="285" y="80" width="190" height="76" rx="10"/><text class="sch-actor" x="380" y="108" text-anchor="middle">Agir</text><text class="sch-lbl sch-faint" x="380" y="132" text-anchor="middle">éditer, créer</text><line class="sch-flow" x1="477" y1="118" x2="536" y2="118" marker-end="url(#ba-ink)"/><rect class="sch-hi" x="540" y="80" width="190" height="76" rx="10"/><text class="sch-actor" x="635" y="108" text-anchor="middle">Vérifier</text><text class="sch-lbl sch-faint" x="635" y="128" text-anchor="middle">lancer les tests,</text><text class="sch-lbl sch-faint" x="635" y="144" text-anchor="middle">lire la sortie</text><line class="sch-flow sch-ret" x1="635" y1="158" x2="635" y2="196" marker-end="url(#ba-ink)"/><text class="sch-lbl" x="623" y="190" text-anchor="end">fin : l'agent estime avoir fini, ou vous l'arrêtez</text></svg>

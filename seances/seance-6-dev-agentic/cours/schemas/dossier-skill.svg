<svg viewBox="-12 -12 844 276" width="844" height="276" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le dossier .github/skills/fiche-feature contient SKILL.md, la procédure avec un en-tête name et description, template.md, une ressource que la procédure utilise, et scripts/verifier.py, un script optionnel. L'en-tête de SKILL.md est chargé dès le démarrage, son corps si la demande correspond, les autres fichiers seulement si la procédure le dit."><style>svg{--ink:#172033;--muted:#5a6579;--line:#dce2eb;--surface:#ffffff;--code-bg:#eef2f7;--accent:#2752c4;--accent-soft:#e7edfb;--mark:#a4520a;--font-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;--font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){svg{--ink:#e3e8f1;--muted:#98a3b7;--line:#263043;--surface:#151c28;--code-bg:#111925;--accent:#86a6ff;--accent-soft:#1b2640;--mark:#f0a35c;}}
.sch-bg{fill:var(--code-bg);}
.sch-wrap { overflow-x: auto; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
.sch-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.sch-hi { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.sch-zone { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 5; }
.sch-zlabel { fill: var(--muted); font: 500 11px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; }
.sch-name { fill: var(--ink); font: 700 19px var(--font-display); }
.sch-actor { fill: var(--ink); font: 600 14px var(--font-display); }
.sch-sub { fill: var(--muted); font: 400 12px var(--font-mono); }
.sch-k { fill: var(--muted); font: 500 10.5px var(--font-body); letter-spacing: 0.08em; }
.sch-v { fill: var(--ink); font: 400 12.5px var(--font-body); }
.sch-lbl { fill: var(--ink); font: 400 12px var(--font-body); }
.sch-phase { fill: var(--muted); font: 600 10.5px var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; }
.sch-life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.sch-tick { stroke: var(--muted); stroke-width: 1; }
.sch-flow { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.sch-flow.sch-tok { stroke: var(--accent); stroke-width: 2; }
.sch-flow.sch-ret { stroke-dasharray: 6 4; }
.sch-ah { fill: var(--ink); }
.sch-ah-tok { fill: var(--accent); }
text.sch-m, tspan.sch-m { font-family: var(--font-mono); font-size: 12px; }
text.sch-m { fill: var(--ink); }
text.sch-big { font-size: 14px; }
text.sch-dot { font-size: 22px; font-weight: 700; }
.sch-faint, text.sch-faint { fill: var(--muted); }
.sch-note { font-style: italic; }
.sch-secret, tspan.sch-secret, text.sch-secret { fill: var(--mark); font-weight: 600; }</style><rect class="sch-bg" x="-12" y="-12" width="844" height="276" rx="10"/><rect class="sch-zone" x="8" y="8" width="804" height="234" rx="14"/><text class="sch-m sch-big" x="24" y="36">.github/skills/fiche-feature/</text><text class="sch-k" x="30" y="66">FICHIER</text><text class="sch-k" x="240" y="66">RÔLE</text><text class="sch-k" x="590" y="66">CHARGÉ DANS LE CONTEXTE</text><rect class="sch-hi" x="30" y="78" width="190" height="40" rx="6"/><text class="sch-m sch-big" x="125" y="103" text-anchor="middle">SKILL.md</text><text class="sch-v" x="240" y="103">la procédure, avec un en-tête <tspan class="sch-m">name</tspan> + <tspan class="sch-m">description</tspan></text><text class="sch-v" x="590" y="95">en-tête : dès le démarrage</text><text class="sch-v" x="590" y="111">corps : si la demande correspond</text><rect class="sch-box" x="30" y="132" width="190" height="40" rx="6"/><text class="sch-m sch-big" x="125" y="157" text-anchor="middle">template.md</text><text class="sch-v" x="240" y="157">une ressource que la procédure utilise</text><text class="sch-v sch-faint" x="590" y="157">seulement si la procédure le dit</text><rect class="sch-box" x="30" y="186" width="190" height="40" rx="6"/><text class="sch-m sch-big" x="125" y="211" text-anchor="middle">scripts/verifier.py</text><text class="sch-v" x="240" y="211">un script que l'agent peut exécuter (optionnel)</text><text class="sch-v sch-faint" x="590" y="211">seulement si la procédure le dit</text></svg>
